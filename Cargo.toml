[package]
name = "leader_schedule"
version = "0.1.0"
edition = "2021"
description = "A CLI tool to fetch and display Solana validator leader schedule information"
license = "MIT"
authors = ["Your Name <your.email@example.com>"]
repository = "https://github.com/your-username/leader_schedule"
readme = "README.md"

[dependencies]
solana-client = "2.3.1"
solana-sdk = "2.3.1"
clap = { version = "4.5", features = ["derive"] }
tabled = "0.16"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
